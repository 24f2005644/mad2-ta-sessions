    <title>Vue Lifecycle Hooks</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
</head>
<body>

<div id="app">
    <h1>{{ message }}</h1>
    <p>Uppercase: {{ upperMessage }}</p>
    <p>Count: {{ count }}</p>

    <button @click="changeMessage">Change Message</button>
    <button @click="increaseCount">Increase Count</button>
    <button @click="destroyApp">Destroy App</button>
</div>

<script>
new Vue({
    el: "#app",

    data() {

        return {
            message: "Hello",
            count: 0
        };
    },

        upperMessage() {
            
            return this.message.toUpperCase();
        }
    },

        showMessage() {
            console.log("method runs when called");
            console.log(this.message);
        },

        changeMessage() {
            this.message = "Vue is useful";
        },

        increaseCount() {
            this.count++;
        },

        destroyApp() {
            this.$destroy();
        }
    },
